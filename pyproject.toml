[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"routelab/api.py" = ["B008"] # FastAPI declarative request metadata.
"scripts/*.py" = ["E402"] # CLI bootstrap establishes the project import root.
